services:
  - type: web
    name: rime-mariner-study-portal
    runtime: node
    plan: free
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci
    startCommand: node server/index.js
    autoDeploy: true
    healthCheckPath: /api/content
    envVars:
      - key: NODE_ENV
        value: production
